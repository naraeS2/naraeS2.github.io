<main>
  <div class="phead">
    <div class="wrap">
      <h1>Tarot Card</h1>
      <p>카드 속의 사람들과, 그들이 펼치는 이야기.</p>

    </div>

    <div class="wrap">
      <div class="filters" id="filters" role="group" aria-label="카드 종류">

        <button class="chip" type="button" data-f="char" aria-pressed="false">캐릭터</button>
        <button class="chip" type="button" data-f="story" aria-pressed="false">스토리</button>

    </div>

  <div class="pnav">
    <a class="btn ghost" href="index.html">← 세계로 돌아가기</a>

  </div>

<footer>
A Tale of ARCANA
</footer>

<noscript><p style="text-align:center;padding:30px;color:#a99dba">카드를 보려면 JavaScript를 켜 주세요.</p></noscript>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="카드 크게 보기" hidden>
  <div id="zoomCard"></div>
  <button class="x" type="button" id="zoomX">닫기</button>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const rail = $('#rail');
let filter = 'all';
function renderCards(){
  const cards = [];
  if(filter !== 'story') CHARS.forEach(c => cards.push(makeCard(c)));
  if(filter !== 'char') STORIES.forEach(s => cards.push(makeStoryCard(s)));
  rail.replaceChildren(...cards);
}
function setFilter(f){
  filter = f;
  $$('#filters .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === f));
  renderCards();
}
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(b) setFilter(b.dataset.f);
});

/* 카드를 누르면 가운데에 크게 띄움 : 앞면 → (누르면) 뒷면 → (누르면) 닫힘 */
const zoom = $('#zoom'), zoomCard = $('#zoomCard');
let lastFocus = null;
const exists = id => byId(id) || STORIES.some(s => s.id === id);
function openZoom(id){
  if(!exists(id)) return;
  const c = byId(id);
  zoomCard.replaceChildren(c ? makeCard(c) : makeStoryCard(STORIES.find(x => x.id === id)));
  if(zoom.hidden){ lastFocus = document.activeElement; document.body.style.overflow = 'hidden'; }
  zoom.hidden = false;
  $('#zoomX').focus();
}
function closeZoom(){
  zoom.hidden = true; zoomCard.replaceChildren(); document.body.style.overflow = '';
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
rail.addEventListener('click', e => {
  const b = e.target.closest('.flip'); if(!b) return;
  e.stopPropagation(); openZoom(b.closest('.tcard').dataset.id);
}, true);
zoom.addEventListener('click', e => {
  const a = e.target.closest('a[data-char]');
  if(a){ e.preventDefault(); openZoom(a.dataset.char); return; }   /* 스토리 카드 뒷면의 캐릭터 버튼 */
  if(e.target.closest('#zoomX')){ closeZoom(); return; }
  if(e.target.closest('a, button')) return;                        /* 앞면 누르기(뒤집기)·대화하러 가기 링크는 그대로 */
  if(e.target.closest('.back') || !e.target.closest('.tcard')) closeZoom();   /* 뒷면이나 바깥을 누르면 닫힘 */
});
addEventListener('keydown', e => { if(e.key === 'Escape' && !zoom.hidden) closeZoom(); });

function openFromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(id) openZoom(id);
}
setFilter('all');
openFromHash();
addEventListener('hashchange', openFromHash);
</script>
</body>
</html>
