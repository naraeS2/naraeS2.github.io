A Tale of ARCANA

<noscript><p style="text-align:center;padding:30px;color:#a99dba">카드를 보려면 JavaScript를 켜 주세요.</p></noscript>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const rail = $('#rail');
let filter = 'all';
function renderCards(){
  const cards = [];
  if(filter !== 'story') CHARS.forEach(c => cards.push(makeCard(c)));
  if(filter !== 'char') STORIES.forEach(s => cards.push(makeStoryCard(s)));
  rail.replaceChildren(...cards);
}
function setFilter(f){
  filter = f;
  $$('#filters .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === f));
  renderCards();
}
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(b) setFilter(b.dataset.f);
});

/* 카드를 찾아 가운데로 스크롤하고 뒤집어 보여 줌 (스토리 카드의 인물 버튼, 카드 뽑기, 주소 #id) */
function showCard(id){
  if(!byId(id) && !STORIES.some(s => s.id === id)) return;
  const need = byId(id) ? 'char' : 'story';
  if(filter !== 'all' && filter !== need) setFilter('all');
  const el = $(`.tcard[data-id="${id}"]`, rail); if(!el) return;
  setTimeout(() => {
    el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center', inline:'center'});
    setTimeout(() => el.setFlip(true), reduce ? 0 : 450);
  }, 250);
}
rail.addEventListener('click', e => {
  const a = e.target.closest('a[data-char]'); if(!a) return;
  e.preventDefault(); showCard(a.dataset.char);
});
function openFromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(id) showCard(id);
}
setFilter('all');
openFromHash();
addEventListener('hashchange', openFromHash);
</script>
</body>
