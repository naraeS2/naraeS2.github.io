<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펼쳐지는 이야기 | 아르카나</title>
<meta name="description" content="카드들이 한 무대에 모일 때, 이야기가 시작됩니다. 아르카나 제국의 스토리 모음.">
<meta property="og:title" content="펼쳐지는 이야기 | 아르카나">
<meta property="og:image" content="https://i.ibb.co/F4XCshdC/image.png">
<meta name="theme-color" content="#150e20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="star8" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></symbol>
    <symbol id="flourish" viewBox="0 0 240 24">
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path id="half" d="M6 12H70C84 12 88 4 98 4C108 4 110 14 103 15C97 16 95 9 101 9"/>
        <use href="#half" transform="translate(240 0) scale(-1 1)"/>
      </g>
      <path d="M120 6l5.5 6-5.5 6-5.5-6z" fill="currentColor"/>
    </symbol>
    <symbol id="corner" viewBox="0 0 48 48">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M3 45V16C3 8 8 3 16 3h29"/>
        <path d="M10 45V19c0-6 3-9 9-9h26" opacity=".55"/>
        <path d="M16 16c6 0 9 3 9 9"/>
      </g>
      <circle cx="16" cy="16" r="2.3" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="in">
    <a class="logo" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star8"/></svg>아르카나</a>
    <nav aria-label="바로가기">
      <a href="index.html#world">세계</a>
      <a href="characters.html">인물</a>
      <a href="stories.html" aria-current="page">이야기</a>
      <a class="pill" href="index.html#draw">카드 뽑기</a>
    </nav>
  </div>
</header>

<main>
  <div class="phead">
    <div class="wrap">
      <h1>펼쳐지는 이야기</h1>
      <p class="en">The Tales</p>
      <p>카드들이 한 무대에 모일 때, 이야기가 시작됩니다.</p>
      <svg class="fl" aria-hidden="true"><use href="#flourish"/></svg>
    </div>
  </div>

  <section style="padding-top:40px">
    <div class="wrap"><div class="stories" id="stories"></div></div>
  </section>

  <div class="pnav">
    <a class="btn ghost" href="index.html">← 세계로 돌아가기</a>
    <a class="btn main" href="characters.html">카드 속의 사람들 →</a>
  </div>
</main>

<footer>
  벨루아 대륙 · 아르카나 제국<br>
  AI 캐릭터와 스토리를 소개하는 팬 페이지입니다.
</footer>

<noscript><p style="text-align:center;padding:30px;color:#a99dba">이야기를 보려면 JavaScript를 켜 주세요.</p></noscript>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
$('#stories').innerHTML = STORIES.map(s => `
  <article class="poster${s.soon ? ' soon' : ''}">
    <span class="st">${s.st}</span>
    ${s.img ? `<img class="cover" src="${s.img}" alt="${s.t} 표지" loading="lazy">` : ''}
    <h3>${s.t}</h3>
    <p class="one">${s.one}</p>
    <p>${s.txt}</p>
    ${s.more ? `<p style="margin-top:10px;color:var(--muted)">${s.more}</p>` : ''}
    <p class="gen">${s.gen}</p>
    ${s.who ? `<div class="who">${s.who.map(id => { const c = byId(id); return `<a href="characters.html#${id}"><b>${c.num}</b>${c.name}${c.ver && /세/.test(c.ver) ? ' (' + c.age + ')' : ''}</a>`; }).join('')}</div>` : ''}
    ${s.link ? `<a class="btn main" href="${s.link}" target="_blank" rel="noopener">✦ 대화하러 가기 ✦</a>` : ''}
  </article>`).join('');
</script>
</body>
</html>
